name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Gate 0 - fixtures (stdlib only, no install)
        run: PYTHONPATH=src python -m szl_evidence_core selftest
      - name: szl.lambda/v1 reference, 60 golden vectors, bitwise
        run: PYTHONPATH=src python -m szl_evidence_core vectors
      - name: Vendored reference is byte-identical to its recorded provenance
        run: |
          echo "57b264fa96056d1f2d77b797ba80eab087a729283f16416196fdd1423c9c532f  src/szl_evidence_core/_vendor/szl_lambda_v1.py" | sha256sum -c -
      - name: RFC 8785 differential test against the rfc8785 reference (20k doubles, 5k documents)
        run: |
          python -m pip install "rfc8785==0.1.4"
          PYTHONPATH=src python - <<'PY'
          import random, math, struct, rfc8785
          from szl_evidence_core.jcs import jcs_bytes, es_number
          rng = random.Random(1); n = bad = 0
          for _ in range(20000):
              x = struct.unpack(">d", struct.pack(">Q", rng.getrandbits(64)))[0]
              if not math.isfinite(x): continue
              n += 1; bad += rfc8785.dumps(x).decode() != es_number(x)
          assert bad == 0, f"{bad} number mismatches"
          pool = ["a","Z","é","✓","日","\U0001F680","\U00010000","\uE000","\uFFFF","\n","\t","\b","\f","\r",'"',"\\","\x01","\x1f","\x7f","\u2028"," "]
          def s(): return "".join(rng.choice(pool) for _ in range(rng.randint(0,6)))
          def v(d=0):
              t = rng.random()
              if d > 3 or t < .25: return rng.choice([None, True, False, rng.randint(-2**53, 2**53), rng.random()*10**rng.randint(-10,25), s()])
              if t < .6: return {s(): v(d+1) for _ in range(rng.randint(0,4))}
              return [v(d+1) for _ in range(rng.randint(0,4))]
          docs = sum(jcs_bytes(x) == rfc8785.dumps(x) for x in (v() for _ in range(5000)))
          assert docs == 5000, f"{5000-docs} document mismatches"
          print(f"jcs: {n} doubles and 5000 documents identical to rfc8785")
          PY

      - name: Test suite (pytest over tests/)
        run: |
          python -m pip install "pytest==9.2.0"
          PYTHONPATH=src python -m pytest -q tests

      - name: Wheel builds and installs into a clean venv
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w dist .
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          cd / && /tmp/clean/bin/python -m szl_evidence_core selftest && /tmp/clean/bin/python -m szl_evidence_core vectors

  compat:
    # Byte-equality against the ORIGINAL _chain.py files the package replaces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fetch the consumer repositories at pinned revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/estate
          # Immutable consumer revisions measured 2026-11-22 from each main HEAD.
          # Bump via pull request when a consumer chain changes; missing pins fail closed.
          pin_for() {
            case "$1" in
              szl-kernels)      echo 1ccbc1d970797049a01769ea1590180719988773 ;;
              szl-blocked)      echo da3e054c581ed31530a7e831f67b7042533af6f3 ;;
              szl-provctl)      echo f987d42fb42a7a57cddb9b432d5b9852dd7fcda2 ;;
              szl-receipt-attn) echo e606b0147f4b8626c888bc5da300ef7f00fce716 ;;
              szl-block-kv)     echo 9aefb5f2761374873e206e0c47d2307dc03abba5 ;;
              szl-maskmod)      echo 539d9bede4c2723e17f628ad961285dcc76fcc65 ;;
              YARQA-ATTN)       echo b1b33dc18dfa7146705fc5a418d3483b655d8929 ;;
              *)              echo "" ;;
            esac
          }
          for r in szl-kernels szl-blocked szl-provctl szl-receipt-attn szl-block-kv szl-maskmod YARQA-ATTN; do
            pin="$(pin_for "$r")"
            if [ -z "$pin" ]; then
              echo "::error::$r has no pinned revision; add it to the pin map in ci.yml" >&2
              exit 2
            fi
            git clone --quiet "https://github.com/szl-holdings/$r.git" "/tmp/estate/$r"
            git -C "/tmp/estate/$r" checkout --quiet "$pin"
            head_sha="$(git -C "/tmp/estate/$r" rev-parse HEAD)"
            if [ "$head_sha" != "$pin" ]; then
              echo "::error::$r pinned checkout mismatch: $head_sha != $pin" >&2
              exit 2
            fi
          done
      - name: compat
        run: >-
          PYTHONPATH=src python -m szl_evidence_core compat /tmp/estate
          --require-chain szl-kernels/torch-ext/szl_kernels/_chain.py
          --require-chain szl-blocked/torch-ext/szl_blocked/_chain.py
          --require-chain szl-provctl/torch-ext/szl_provctl/_chain.py
          --require-chain szl-receipt-attn/torch-ext/szl_receipt_attn/_chain.py
          --require-chain szl-block-kv/torch-ext/szl_block_kv/_chain.py
          --require-chain szl-maskmod/torch-ext/szl_maskmod/_chain.py
          --require-chain YARQA-ATTN/torch-ext/yarqa_attn/_chain.py

