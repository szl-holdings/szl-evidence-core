name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Gate 0 - fixtures (stdlib only, no install)
        run: PYTHONPATH=src python -m szl_evidence_core selftest
      - name: szl.lambda/v1 reference, 60 golden vectors, bitwise
        run: PYTHONPATH=src python -m szl_evidence_core vectors
      - name: Vendored reference is byte-identical to its recorded provenance
        run: |
          echo "57b264fa96056d1f2d77b797ba80eab087a729283f16416196fdd1423c9c532f  src/szl_evidence_core/_vendor/szl_lambda_v1.py" | sha256sum -c -
      - name: RFC 8785 differential test against the rfc8785 reference (20k doubles, 5k documents)
        run: |
          python -m pip install "rfc8785==0.1.4"
          PYTHONPATH=src python - <<'PY'
          import random, math, struct, rfc8785
          from szl_evidence_core.jcs import jcs_bytes, es_number
          rng = random.Random(1); n = bad = 0
          for _ in range(20000):
              x = struct.unpack(">d", struct.pack(">Q", rng.getrandbits(64)))[0]
              if not math.isfinite(x): continue
              n += 1; bad += rfc8785.dumps(x).decode() != es_number(x)
          assert bad == 0, f"{bad} number mismatches"
          pool = ["a","Z","é","✓","日","\U0001F680","\U00010000","\uE000","\uFFFF","\n","\t","\b","\f","\r",'"',"\\","\x01","\x1f","\x7f","\u2028"," "]
          def s(): return "".join(rng.choice(pool) for _ in range(rng.randint(0,6)))
          def v(d=0):
              t = rng.random()
              if d > 3 or t < .25: return rng.choice([None, True, False, rng.randint(-2**53, 2**53), rng.random()*10**rng.randint(-10,25), s()])
              if t < .6: return {s(): v(d+1) for _ in range(rng.randint(0,4))}
              return [v(d+1) for _ in range(rng.randint(0,4))]
          docs = sum(jcs_bytes(x) == rfc8785.dumps(x) for x in (v() for _ in range(5000)))
          assert docs == 5000, f"{5000-docs} document mismatches"
          print(f"jcs: {n} doubles and 5000 documents identical to rfc8785")
          PY

      - name: Wheel builds and installs into a clean venv
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w dist .
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          cd / && /tmp/clean/bin/python -m szl_evidence_core selftest && /tmp/clean/bin/python -m szl_evidence_core vectors

  compat:
    # Byte-equality against the ORIGINAL _chain.py files the package replaces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch the consumer repositories at their default branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/estate
          for r in szl-kernels szl-blocked szl-provctl szl-receipt-attn szl-block-kv szl-maskmod YARQA-ATTN; do
            git clone --depth 1 "https://github.com/szl-holdings/$r.git" "/tmp/estate/$r" || echo "::warning::could not clone $r"
          done
      - name: compat
        run: PYTHONPATH=src python -m szl_evidence_core compat /tmp/estate
